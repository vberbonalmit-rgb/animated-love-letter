<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animated Love Letter</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="hearts"></div>

<div class="card" id="card">

    <div class="envelope">
        <div class="top"></div>
        <div class="letter">

            <h2>❤️ My Love ❤️</h2>

            <p>
                Every moment with you feels like the most beautiful dream.
                Your smile brightens my darkest days, and your love fills my
                heart with happiness.
            </p>

            <p>
                Thank you for being my inspiration, my happiness, and my
                forever favorite person.
            </p>

            <h3>I Love You Forever ❤️</h3>

        </div>

    </div>

    <p class="click">💌 Click the Envelope 💌</p>

</div>

<script src="script.js"></script>

</body>
</html>
