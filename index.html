<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love Letter</title>

    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
</head>

<body>

<div class="background-hearts">
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
</div>

<input type="checkbox" id="open">

<div class="wrapper">

    <label for="open" class="card">

        <!-- LETTER -->

        <div class="letter">

            <div class="paper">

                <h1>❤️ My Love ❤️</h1>

                <p>
                    Every day with you is my favorite day.
                    Thank you for being my happiness,
                    my peace, and my greatest adventure.
                </p>

                <p>
                    Whenever I smile,
                    there's a good chance it's because
                    I was thinking about you.
                </p>

                <h2>Forever Yours ❤️</h2>

            </div>

        </div>

        <!-- ENVELOPE -->

        <div class="envelope">

            <div class="back"></div>

            <div class="left"></div>

            <div class="right"></div>

            <div class="bottom"></div>

            <div class="flap"></div>

            <div class="seal">
                ❤
            </div>

        </div>

    </label>

</div>

</body>
</html>
