<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animated Love Letter</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="background-hearts">
    <span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span>
</div>

<input type="checkbox" id="open">

<label class="envelope-container" for="open">

    <div class="letter">

        <h2>❤️ My Peeps ❤️</h2>

        <p>
            Every moment with you is a beautiful memory.
            Charot, thank you sa pakain, sa patulog,
            Sa pa-wifi at sa endless bembang hahahaha.
        </p>

        <p>
            No matter where life takes us,
            my heart will always belong to you.
            Eme. hahahahaha
        </p>

        <h3>Forever Yours 💖</h3>

    </div>

    <div class="envelope">

        <div class="front"></div>
        <div class="flap"></div>

        <div class="heart"></div>

    </div>

</label>

</body>
</html>
